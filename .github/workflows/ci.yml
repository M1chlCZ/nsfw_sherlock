name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y libtesseract-dev libleptonica-dev tesseract-ocr tesseract-ocr-eng

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -race

      - name: Test OCR
        run: go test -tags ocr ./... -count=1 -race

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

      - name: Lint OCR
        run: golangci-lint run --build-tags ocr

  build:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: nsfw-sherlock:ci
          load: true
          build-args: |
            MODELS_BASE_URL=https://github.com/${{ github.repository }}/releases/download/models-v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --rm --name nsfw-sherlock -e PORT=4100 -p 4000:4100 nsfw-sherlock:ci

      - name: Wait for health
        run: |
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' nsfw-sherlock)" = "healthy" ]; then
              echo "container healthy after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "container did not become healthy within 60s" >&2
          docker logs nsfw-sherlock >&2
          exit 1

      - name: Smoke test /pic/check
        run: |
          payload=$(python3 -c 'import base64,json; print(json.dumps({"base64": base64.b64encode(open("testdata/pic.jpg","rb").read()).decode(), "filename":"pic.jpg"}))')
          response=$(curl -fsS -X POST -H 'Content-Type: application/json' -d "$payload" http://localhost:4000/pic/check)
          echo "$response"
          echo "$response" | grep -q '"status":"ok"'
          echo "smoke test passed"

      - name: Stop container
        if: always()
        run: docker stop nsfw-sherlock || true
