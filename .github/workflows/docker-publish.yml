name: Publish Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ matrix.variant }} image
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            suffix: ""
            platforms: linux/amd64,linux/arm64
            runtime-image: debian:bookworm-slim
            provider: cpu
          - variant: cuda12
            suffix: -cuda
            platforms: linux/amd64
            runtime-image: nvidia/cuda:12.9.1-cudnn-runtime-ubuntu24.04
            provider: cuda
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            m1chl/nsfw-sherlock
            ghcr.io/${{ github.repository_owner }}/nsfw_sherlock
          tags: |
            type=raw,value=${{ github.ref_name }}${{ matrix.suffix }}
            type=raw,value=latest${{ matrix.suffix }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MODELS_BASE_URL=https://github.com/${{ github.repository }}/releases/download/models-v1
            RUNTIME_IMAGE=${{ matrix.runtime-image }}
            ORT_VARIANT=${{ matrix.variant }}
            ORT_PROVIDER=${{ matrix.provider }}
            VERSION=${{ github.ref_name }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

  description:
    name: Sync Docker Hub description
    needs: validate
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Update description
        env:
          DOCKER_LOGIN: ${{ secrets.DOCKER_LOGIN }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -eu
          token=$(curl -fsSL -X POST https://hub.docker.com/v2/users/login/ \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg u "$DOCKER_LOGIN" --arg p "$DOCKER_PASSWORD" '{username:$u,password:$p}')" \
            | jq -r .token)
          jq -n --rawfile d DOCKERHUB.md '{full_description: $d}' \
            | curl -fsSL -X PATCH https://hub.docker.com/v2/repositories/m1chl/nsfw-sherlock/ \
                -H "Authorization: JWT $token" \
                -H 'Content-Type: application/json' \
                --data @-
